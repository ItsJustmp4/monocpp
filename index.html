<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" href="/favicon.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MonoCPP | Онлайн компилятор C++</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>

  <style>
    :root {
      --bg: #050505;
      --surface: #111111;
      --border: #222222;
      --text: #e0e0e0;
      --text-dim: #666666;
      --accent: #ffffff;
      --accent-text: #000000;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button:hover {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    button.primary {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    button.primary:hover {
      background: #d4d4d4;
      border-color: #d4d4d4;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-height: 0;
    }

    .editor-wrapper {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      min-height: 300px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #0a0a0a;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-dim);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }

    .CodeMirror {
      height: 100% !important;
      flex: 1;
    }

    .stdin-wrapper {
      height: 90px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    #stdin-input {
      flex: 1;
      padding: 12px 16px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13px;
      color: var(--text);
      background: var(--surface);
      border: none;
      outline: none;
      resize: none;
      line-height: 1.5;
    }

    #stdin-input::placeholder {
      color: var(--text-dim);
    }

    .output-wrapper {
      height: 220px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    #output {
      flex: 1;
      padding: 16px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13px;
      color: var(--text);
      white-space: pre-wrap;
      overflow: auto;
      margin: 0;
      line-height: 1.5;
    }

    .status-bar {
      padding: 10px 16px;
      background: #0a0a0a;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--text-dim);
    }

    .dot.success { background-color: #ffffff; box-shadow: 0 0 8px rgba(255,255,255,0.4); }
    .dot.error { background-color: #ffffff; }
    .dot.running { background-color: #888888; animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .cm-s-monocpp.CodeMirror {
      background: #111111;
      color: #e0e0e0;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 14px;
      line-height: 1.6;
    }
    .cm-s-monocpp .CodeMirror-gutters {
      background: #111111;
      border-right: 1px solid #222222;
      color: #444444;
    }
    .cm-s-monocpp .CodeMirror-linenumber {
      color: #444444;
    }
    .cm-s-monocpp .CodeMirror-cursor {
      border-left: 2px solid #ffffff;
    }
    .cm-s-monocpp .CodeMirror-selected {
      background: #333333;
    }
    .cm-s-monocpp .CodeMirror-activeline-background {
      background: #1a1a1a;
    }
    .cm-s-monocpp .CodeMirror-matchingbracket {
      background: #333333;
      color: #ffffff !important;
    }
    .cm-s-monocpp .cm-keyword { color: #ffffff; font-weight: bold; }
    .cm-s-monocpp .cm-atom { color: #aaaaaa; }
    .cm-s-monocpp .cm-number { color: #aaaaaa; }
    .cm-s-monocpp .cm-def { color: #ffffff; }
    .cm-s-monocpp .cm-variable { color: #e0e0e0; }
    .cm-s-monocpp .cm-variable-2 { color: #cccccc; }
    .cm-s-monocpp .cm-property { color: #e0e0e0; }
    .cm-s-monocpp .cm-operator { color: #ffffff; }
    .cm-s-monocpp .cm-comment { color: #666666; font-style: italic; }
    .cm-s-monocpp .cm-string { color: #aaaaaa; }
    .cm-s-monocpp .cm-meta { color: #888888; }
    .cm-s-monocpp .cm-builtin { color: #ffffff; }
    .cm-s-monocpp .cm-bracket { color: #ffffff; }
    
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
  </style>
</head>
<body>
  <header>
    <h1>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
      MonoCPP
    </h1>
    <div class="controls">
      <button onclick="clearEditor()" title="Очистить редактор">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        Очистить
      </button>
      <button onclick="copyCode()" title="Копировать код">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        Копировать
      </button>
      <button class="primary" onclick="runCode()" id="runBtn" title="Запустить (Ctrl+Enter / Cmd+Enter)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        Запустить
      </button>
    </div>
  </header>

  <div class="main-container">
    <div class="editor-wrapper">
      <div class="panel-header">
        <span>main.cpp</span>
        <span>C++ (GCC)</span>
      </div>
      <textarea id="code-editor"></textarea>
    </div>

    <div class="stdin-wrapper">
      <div class="panel-header">
        <span>Ввод (stdin)</span>
      </div>
      <textarea id="stdin-input" placeholder="Введите данные для cin здесь (каждое значение с новой строки или через пробел)..."></textarea>
    </div>

    <div class="output-wrapper">
      <div class="panel-header">
        <span>Консоль вывода</span>
      </div>
      <pre id="output">// Результат выполнения появится здесь...</pre>
      <div class="status-bar">
        <div class="status-indicator">
          <div class="dot" id="statusDot"></div>
          <span id="statusText">Готов к работе</span>
        </div>
        <span id="execTime"></span>
      </div>
    </div>
  </div>

  <script>
    const defaultCode = `#include <iostream>

int main() {
    int a, b;
    std::cout << "Введите два числа: ";
    std::cin >> a >> b;
    std::cout << "Сумма: " << a + b << std::endl;
    return 0;
}`;

    const editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
      mode: 'text/x-c++src',
      theme: 'monocpp',
      lineNumbers: true,
      autoCloseBrackets: true,
      matchBrackets: true,
      indentUnit: 4,
      tabSize: 4,
      indentWithTabs: false,
      autofocus: true,
      lineWrapping: false,
      extraKeys: {
        "Ctrl-Enter": runCode,
        "Cmd-Enter": runCode
      }
    });

    function clearEditor() {
      editor.setValue('');
      document.getElementById('stdin-input').value = '';
      editor.focus();
      document.getElementById('output').textContent = '// Результат выполнения появится здесь...';
      setStatus('ready', 'Готов к работе');
      document.getElementById('execTime').textContent = '';
    }

    function copyCode() {
      const code = editor.getValue();
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('button[onclick="copyCode()"]');
        const originalHTML = btn.innerHTML;
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Скопировано!`;
        setTimeout(() => {
          btn.innerHTML = originalHTML;
        }, 2000);
      });
    }

    async function runCode() {
      const code = editor.getValue();
      const stdinValue = document.getElementById('stdin-input').value;
      const outputEl = document.getElementById('output');
      const runBtn = document.getElementById('runBtn');
      
      setStatus('running', 'Компиляция и запуск...');
      outputEl.textContent = '';
      runBtn.disabled = true;
      document.getElementById('execTime').textContent = '';

      const startTime = performance.now();

      try {
        const response = await fetch('https://wandbox.org/api/compile.json', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            code: code,
            compiler: 'gcc-head',
            options: 'warning,c++20',
            stdin: stdinValue,
            'compiler-option-raw': '',
            'runtime-option-raw': ''
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const result = await response.json();
        const endTime = performance.now();
        const execTime = ((endTime - startTime) / 1000).toFixed(2);
        document.getElementById('execTime').textContent = `${execTime}s`;

        if (result.compiler_error) {
          setStatus('error', 'Ошибка компиляции');
          outputEl.textContent = result.compiler_error + (result.compiler_message ? '\n' + result.compiler_message : '');
        } else if (result.program_error) {
          setStatus('error', 'Ошибка выполнения');
          outputEl.textContent = result.program_error + (result.program_message ? '\n' + result.program_message : '');
        } else {
          setStatus('success', 'Успешно выполнено');
          outputEl.textContent = result.program_output || '(Программа завершилась без вывода)';
        }
      } catch (error) {
        setStatus('error', 'Ошибка сети или API');
        outputEl.textContent = `Не удалось выполнить код: ${error.message}\n\nПроверьте подключение к интернету или попробуйте позже.`;
      } finally {
        runBtn.disabled = false;
        editor.focus();
      }
    }

    function setStatus(type, text) {
      const dot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      dot.className = 'dot ' + type;
      statusText.textContent = text;
    }
  </script>
</body>
</html>
